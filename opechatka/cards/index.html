<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>О! печатка — карточки товаров</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a1f24;
      --muted: #5c6770;
      --paper: #f3f0ea;
      --card: #fffdf8;
      --line: #e4ddd2;
      --accent: #0f7a6c;
      --accent-2: #d97706;
      --soft: #e7f3f0;
      --shadow: 0 12px 40px rgba(26, 31, 36, 0.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Manrope, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, #d8efe9 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 0%, #f8e7c8 0%, transparent 50%),
        var(--paper);
      line-height: 1.45;
    }

    .wrap {
      width: min(1180px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2.5rem 0 4rem;
    }

    header {
      display: grid;
      gap: 1rem;
      margin-bottom: 2.5rem;
      animation: rise 0.7s ease both;
    }

    .brand {
      font-family: Unbounded, sans-serif;
      font-size: clamp(2rem, 5vw, 3.4rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      margin: 0;
    }

    .brand span { color: var(--accent); }

    .lead {
      max-width: 42rem;
      color: var(--muted);
      font-size: 1.05rem;
      margin: 0;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .chip {
      background: var(--card);
      border: 1px solid var(--line);
      padding: 0.45rem 0.8rem;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .chip.accent {
      background: var(--soft);
      border-color: #b9ddd5;
      color: var(--accent);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      animation: rise 0.7s ease 0.1s both;
    }

    .filters button {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      padding: 0.55rem 0.9rem;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .filters button:hover,
    .filters button.active {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.1rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      min-height: 100%;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      animation: rise 0.6s ease both;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 48px rgba(26, 31, 36, 0.12);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      align-items: start;
    }

    .cat {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--soft);
      padding: 0.3rem 0.55rem;
    }

    .price {
      font-family: Unbounded, sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent-2);
      white-space: nowrap;
    }

    h2 {
      font-family: Unbounded, sans-serif;
      font-size: 1.15rem;
      margin: 0;
      letter-spacing: -0.02em;
    }

    .short {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .desc {
      margin: 0;
      font-size: 0.92rem;
      flex: 1;
    }

    ul {
      margin: 0;
      padding-left: 1.1rem;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .usps {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .usp {
      font-size: 0.78rem;
      font-weight: 600;
      background: #fff4e5;
      color: #9a5b08;
      padding: 0.28rem 0.5rem;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 0.25rem;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      padding: 0.75rem 1rem;
      transition: background 0.2s ease;
    }

    .cta:hover { background: #0b5f54; }

    .packages {
      margin-top: 3rem;
      animation: rise 0.7s ease 0.15s both;
    }

    .packages h3 {
      font-family: Unbounded, sans-serif;
      font-size: 1.5rem;
      margin: 0 0 1rem;
    }

    .pkg-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem;
    }

    .pkg {
      background: linear-gradient(160deg, #123c36, #0f7a6c);
      color: #f4fffc;
      padding: 1.2rem;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .pkg h4 {
      font-family: Unbounded, sans-serif;
      margin: 0;
      font-size: 1.05rem;
    }

    .pkg p { margin: 0; opacity: 0.9; font-size: 0.9rem; }
    .pkg .price { color: #ffd89a; }

    footer {
      margin-top: 2.5rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      .wrap { width: min(100% - 1.25rem, 1180px); padding-top: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 class="brand">О! <span>печатка</span></h1>
      <p class="lead">Карточки товаров и услуг для витрины, сайта и Яндекс.Карт. Копицентр и фотосалон в ЖК Бутово Парк.</p>
      <div class="meta">
        <span class="chip accent">★ 5,0 · 345 оценок</span>
        <span class="chip">Бутово Парк, 18</span>
        <span class="chip">+7 (909) 667-00-55</span>
        <span class="chip">до 20:00</span>
      </div>
    </header>

    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>

    <section class="packages">
      <h3>Пакеты для акций</h3>
      <div class="pkg-grid" id="packages"></div>
    </section>

    <footer>
      Данные по прайсу с Яндекс.Карт. Перед публикацией сверьте актуальные цены с точкой.
    </footer>
  </div>

  <script>
    const dataUrl = "./tovary.json";

    const categoryOrder = [
      "Все",
      "Фотоуслуги",
      "Фотопечать",
      "Копицентр",
      "Печати и штампы",
      "Типография",
      "Широкоформат",
      "Сувениры",
      "Дизайн",
      "Документы",
      "Оцифровка",
      "Учёба",
      "Оформление"
    ];

    async function main() {
      const res = await fetch(dataUrl);
      const data = await res.json();
      let active = "Все";

      const filters = document.getElementById("filters");
      const grid = document.getElementById("grid");
      const packages = document.getElementById("packages");

      const cats = categoryOrder.filter(
        (c) => c === "Все" || data.cards.some((card) => card.category === c)
      );

      function renderFilters() {
        filters.innerHTML = cats
          .map(
            (c) =>
              `<button type="button" class="${c === active ? "active" : ""}" data-cat="${c}">${c}</button>`
          )
          .join("");
      }

      function renderCards() {
        const list =
          active === "Все"
            ? data.cards
            : data.cards.filter((c) => c.category === active);

        grid.innerHTML = list
          .map(
            (card, i) => `
          <article class="card" style="animation-delay:${i * 0.03}s" data-category="${card.category}">
            <div class="card-top">
              <span class="cat">${card.category}</span>
              <span class="price">${card.price_label}</span>
            </div>
            <h2>${card.title}</h2>
            <p class="short">${card.short}</p>
            <p class="desc">${card.description}</p>
            <ul>
              ${card.variants
                .slice(0, 4)
                .map((v) => `<li>${v}</li>`)
                .join("")}
            </ul>
            <div class="usps">
              ${(card.usp || []).map((u) => `<span class="usp">${u}</span>`).join("")}
            </div>
            <a class="cta" href="tel:+79096670055">${card.cta}</a>
          </article>`
          )
          .join("");
      }

      packages.innerHTML = data.packages
        .map(
          (p) => `
        <div class="pkg">
          <h4>${p.title}</h4>
          <p>${p.items.join(" · ")}</p>
          <p>${p.for}</p>
          <span class="price">${p.price_label}</span>
        </div>`
        )
        .join("");

      filters.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-cat]");
        if (!btn) return;
        active = btn.dataset.cat;
        renderFilters();
        renderCards();
      });

      renderFilters();
      renderCards();
    }

    main().catch((err) => {
      document.getElementById("grid").innerHTML =
        `<p>Не удалось загрузить tovary.json: ${err.message}</p>`;
    });
  </script>
</body>
</html>
